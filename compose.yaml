services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: esl
      POSTGRES_PASSWORD: esl
      POSTGRES_DB: esl
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esl -d esl"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "9000:9000"

  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://esl:esl@postgres:5432/esl
      ARTIFACT_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: esl-artifacts
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio-secret
      S3_REGION: us-east-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
