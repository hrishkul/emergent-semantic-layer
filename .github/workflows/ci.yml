name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: esl
          POSTGRES_PASSWORD: esl
          POSTGRES_DB: esl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esl -d esl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://esl:esl@127.0.0.1:5432/esl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m esl.migrate
      - run: pytest
