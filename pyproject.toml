[project]
name = "emergent-semantic-layer"
version = "0.1.0"
description = "Control plane for an emergent semantic layer. Agents propose. Pipelines execute. A person approves."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "fastapi>=0.115",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-sdk>=1.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "moto[server]>=5.0",
  "pytest>=8.3",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esl = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
